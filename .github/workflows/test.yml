name: Test & Quality Assurance CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  test:
    name: Automated Unit, API, Security & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PORT: 5000
      NODE_ENV: development
      JWT_SECRET: profit_gym_super_secure_jwt_secret_key_2026_x92
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID || 'rzp_test_PROFIT_GYM_DEV_KEY' }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET || 'profit_gym_secret_dev_382910' }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Frontend & Root Dependencies
        run: npm ci

      - name: Install Server Dependencies
        run: cd server && npm ci && cd ..

      - name: TypeScript & Build Verification
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Services & Run Complete Test Suite
        run: |
          node server/server.js > server.log 2>&1 &
          SERVER_PID=$!
          npx vite --host 127.0.0.1 --port 3000 > vite.log 2>&1 &
          VITE_PID=$!

          echo "Waiting for services to become healthy..."
          if ! npx wait-on -t 45000 http://127.0.0.1:5000/api/health http://127.0.0.1:3000; then
            echo "::error::Services failed to start within 45s"
            echo "===== SERVER LOG ====="
            cat server.log || true
            echo "===== VITE LOG ====="
            cat vite.log || true
            kill $SERVER_PID $VITE_PID 2>/dev/null || true
            exit 1
          fi

          echo "Services are ready! Running complete test suite..."
          npm test
          TEST_EXIT_CODE=$?

          kill $SERVER_PID $VITE_PID 2>/dev/null || true
          exit $TEST_EXIT_CODE
